name: Build Bubble Blast APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project from repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP file not found"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d extracted
          cp -a extracted/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

            - name: Compile Android application
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BubbleBlast-APK
          path: app/build/outputs/apk/debug/app-debug.apk
